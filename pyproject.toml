[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "da-edgeformer-nilm"
version = "0.1.0"
description = "Drift-aware, parameter-efficient continual NILM under sparse labels and edge budgets"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Pourya Moghadam"}, {name = "Atena Roshan Fekr"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
profile = ["psutil>=5.9,<8", "thop>=0.1.1.post2209072238"]
data = ["pyarrow>=16,<23", "openpyxl>=3.1,<4"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]

[project.scripts]
da-edgeformer = "da_edgeformer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/da_edgeformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
