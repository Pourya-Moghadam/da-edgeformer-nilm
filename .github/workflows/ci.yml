name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements/ci-cpu.txt
      - run: python -m pip install -e . --no-deps
      - run: ruff check .
      - run: pytest
      - run: da-edgeformer smoke
      - run: da-edgeformer audit
      - run: da-edgeformer release-audit
